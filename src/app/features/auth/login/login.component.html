<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Sign in to TruthLens AI</h1>
      <p class="text-gray-500 text-sm mt-2">Track your analyses and contribute to community intelligence</p>
    </div>

    <!-- Form card -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8">
      <form [formGroup]="form" (ngSubmit)="submit()">

        <!-- Email -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
          <input formControlName="email" type="email"
            class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            [class.border-red-400]="form.get('email')?.invalid && form.get('email')?.touched"
            placeholder="you@example.com" />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <p class="text-xs text-red-500 mt-1">Valid email is required</p>
          }
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input formControlName="password" type="password"
            class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            [class.border-red-400]="form.get('password')?.invalid && form.get('password')?.touched"
            placeholder="••••••••" />
        </div>

        <!-- Server error -->
        @if (errorMsg()) {
          <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
            {{ errorMsg() }}
          </div>
        }

        <!-- Submit -->
        <button type="submit"
          [disabled]="form.invalid || loading()"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2">
          @if (loading()) {
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
          }
          {{ loading() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account?
        <a routerLink="/auth/register" class="text-blue-600 hover:underline font-medium">Create one</a>
      </p>
    </div>

  </div>
</div>
